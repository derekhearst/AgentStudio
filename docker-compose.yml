# Mirrors the live TrueNAS custom app `agentstudio` (192.168.0.2, host port 1234,
# proxied as https://agentstudio.derekhearst.com). Keep this file and
# `midclt call app.config agentstudio` in sync — this is the source the app was
# created from, and a redeploy from a stale copy is how you lose the Claude login.
#
# Names are lowercase because that is what the app was created with; changing them
# recreates the container under a new name.

services:
  agentstudio:
    image: ghcr.io/derekhearst/agentstudio:latest
    container_name: agentstudio
    restart: unless-stopped
    # uid/gid 950 = truenas_admin. Without the remap, anything the agent writes to
    # /workspace is root-owned and undeletable, because sudo needs a password there.
    user: "950:950"
    ports:
      - "1234:3000"
    volumes:
      # HOME for the container. Holds ~/.claude, which is the Claude Code CLI login
      # the Agent SDK runs on — lose this mount and every chat fails to authenticate.
      - /mnt/Apps/Apps/AgentStudioHome:/data
      - /mnt/Apps/Apps/AgentStudioHome/workspace:/workspace
    environment:
      - HOME=/data
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Creates the owner on first boot against an empty (or reset) database, so /setup
      # never opens on this public host. Never overwrites an existing password — change
      # it here and the old one still applies. Unset it and a reset instance falls back
      # to /setup, which then asks for the one-time token printed in the container log.
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - SEARXNG_URL=${SEARXNG_URL}
      - SEARXNG_PASSWORD=${SEARXNG_PASSWORD}
      - SANDBOX_WORKSPACE=/workspace
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - ORIGIN=${ORIGIN}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      # Derives the AES key for stored OAuth tokens. This was CLAIM_KEY until
      # 2026-09-21; the live app was moved to APP_ENCRYPTION_KEY carrying the same
      # value, so the existing GitHub token still decrypts. Change the value and it
      # will not — the connection then has to be re-authorized.
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      # Optional, off by default: an Anthropic-compatible gateway for non-Claude models (#9).
      # Both empty means only Claude models are offered, and they run on the subscription.
      # Gateway runs are billed per token. See docs/llm/llm.md.
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-}
      - LLM_GATEWAY_TOKEN=${LLM_GATEWAY_TOKEN:-}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      # BODY_SIZE_LIMIT (the largest upload the server accepts) is 25M, set by the image.
      # To raise it, add a literal value here, e.g. `- BODY_SIZE_LIMIT=110M` for 100MB
      # videos. Never `${BODY_SIZE_LIMIT}` without a default: an unset variable becomes an
      # empty string, which the server reads as a limit of 0 bytes and refuses every upload.
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Pulls a new :latest within ~100s of the GitHub Actions image build finishing —
  # that push-to-main → live window is the whole deploy process.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-agentstudio
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=100
      - WATCHTOWER_LABEL_ENABLE=true
